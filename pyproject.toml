[project]
name = "emtec-scraper"
version = "0.1.0"
description = "Scraping profundo para atas vigentes e aditivos de contratos públicos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pydantic>=2.7.0",
  "pypdf>=4.2.0",
  "python-dateutil>=2.9.0",
  "tenacity>=8.2.3",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.1"
]

[project.scripts]
atas-scraper = "scraper.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

